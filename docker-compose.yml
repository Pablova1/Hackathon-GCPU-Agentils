  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: agentils-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - MONGO_URI=${MONGO_URI}
      - MONGO_DB=${MONGO_DB}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GCP_PROJECT_ID=${GOOGLE_CLOUD_PROJECT}
      - WEEKLY_SCORE_SYSTEM_PROMPT=${WEEKLY_SCORE_SYSTEM_PROMPT}
    volumes:
      - ./backend:/app/backend
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - agentils-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: agentils-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NODE_ENV=development
    depends_on:
      - backend
    networks:
      - agentils-network
    # Pour le développement avec hot reload
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

networks:
  agentils-network:
    driver: bridge

# MongoDB local désactivé - pas besoin de volume
