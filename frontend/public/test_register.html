<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Inscription</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #0070f3;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0051cc;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>🧪 Test d'inscription</h1>
    
    <form id="registerForm">
        <div class="form-group">
            <label for="firstName">Prénom:</label>
            <input type="text" id="firstName" value="Test" required>
        </div>
        
        <div class="form-group">
            <label for="lastName">Nom:</label>
            <input type="text" id="lastName" value="User" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" value="test@example.com" required>
        </div>
        
        <div class="form-group">
            <label for="password">Mot de passe:</label>
            <input type="password" id="password" value="test123" required>
        </div>
        
        <button type="submit">S'inscrire</button>
    </form>
    
    <div id="result"></div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Chargement...</p>';
            
            const data = {
                first_name: document.getElementById('firstName').value,
                last_name: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };
            
            console.log('📤 Envoi des données:', data);
            console.log('📍 URL:', 'http://localhost:8000/api/auth/register');
            
            try {
                const response = await fetch('http://localhost:8000/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                console.log('📥 Status:', response.status);
                const responseData = await response.json();
                console.log('📥 Réponse:', responseData);
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>✅ Inscription réussie !</h3>
                        <p><strong>User ID:</strong> ${responseData.user_id}</p>
                        <p><strong>Session Token:</strong> ${responseData.session_token}</p>
                        <p><strong>Email:</strong> ${responseData.email}</p>
                        <p><strong>Nom:</strong> ${responseData.first_name} ${responseData.last_name}</p>
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <h3>❌ Erreur ${response.status}</h3>
                        <p>${JSON.stringify(responseData, null, 2)}</p>
                    `;
                }
            } catch (error) {
                console.error('❌ Erreur:', error);
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <h3>❌ Erreur de connexion</h3>
                    <p>${error.message}</p>
                    <p>Vérifiez que le backend est démarré sur http://localhost:8000</p>
                `;
            }
        });
    </script>
</body>
</html>
